spring:
  application:
    name: sketchTalk
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
    open-in-view: false

  jwt:
    secret: ${JWT_SECRET}
    expiration:
      ms: ${JWT_EXPIRATION_MS}

  refresh:
    duration:
      ms: ${REFRESH_DURATION_MS}

  servlet:
    multipart:
      enabled: true
      maxFileSize: 200MB
      maxRequestSize: 300MB

fastapi:
  endpoint: http://13.125.170.8:8000
  image-endpoint : http://16.184.59.146:8000

firebase:
  service-account: ${FIREBASE_SERVICE_ACCOUNT}
  project-id: ${FIREBASE_PROJECT_ID}

cloud:
  aws:
    s3:
      bucket: sketchtalk-s3
      url: ${S3URL}
    credentials:
      access-key: ${ACCESS_KEY}
      secret-key: ${SECRET_KEY}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false
